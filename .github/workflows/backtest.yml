name: NSE Scanner Backtest

on:
  workflow_dispatch:
    inputs:

      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: "2020-01-01"

      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: false
        default: "2025-12-31"

      side:
        description: "Trade direction"
        required: false
        default: "SHORT"

        type: choice

        options:
          - BOTH
          - LONG
          - SHORT

      round_trip_cost_pct:
        description: "Round-trip cost (%)"
        required: false
        default: "0.10"


jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 180


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Set up Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.11"


      # ========================================================
      # INSTALL
      # ========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            pandas \
            numpy \
            pyarrow


      # ========================================================
      # DOWNLOAD 2018-2025
      # ========================================================

      - name: Download NSE data 2018-2025

        run: |

          git clone \
            --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data.git \
            historical_2018_2025


      # ========================================================
      # DOWNLOAD 2026
      # ========================================================

      - name: Download NSE data 2026

        run: |

          git clone \
            --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data_2026.git \
            historical_2026


      # ========================================================
      # VERIFY DATA
      # ========================================================

      - name: Verify historical data

        shell: bash

        run: |

          OLD_COUNT=$(

            find historical_2018_2025 \
              -type f \
              \( \
                -name "*.parquet" \
                -o \
                -name "*.pq" \
              \) \
              -print \
              | wc -l

          )


          NEW_COUNT=$(

            find historical_2026 \
              -type f \
              \( \
                -name "*.parquet" \
                -o \
                -name "*.pq" \
              \) \
              -print \
              | wc -l

          )


          TOTAL=$((OLD_COUNT + NEW_COUNT))


          echo "2018-2025 files: $OLD_COUNT"

          echo "2026 files:      $NEW_COUNT"

          echo "Total files:     $TOTAL"


          if [ "$TOTAL" -eq 0 ]; then

            echo "ERROR: No Parquet files found."

            exit 1

          fi


      # ========================================================
      # VERIFY BACKTESTER
      # ========================================================

      - name: Verify backtest.py

        run: |

          if [ ! -f "backtest.py" ]; then

            echo "ERROR: backtest.py not found."

            exit 1

          fi

          echo "backtest.py found."


      # ========================================================
      # RUN BACKTEST
      # ========================================================

      - name: Run backtest

        env:

          START_DATE: ${{ inputs.start_date }}

          END_DATE: ${{ inputs.end_date }}

          TRADE_SIDE: ${{ inputs.side }}

          ROUND_TRIP_COST_PCT: ${{ inputs.round_trip_cost_pct }}

        run: |

          python -u backtest.py


      # ========================================================
      # UPLOAD RESULTS
      # ========================================================

      - name: Upload backtest results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: NSE-backtest-results

          path: results/

          if-no-files-found: warn

          retention-days: 30
