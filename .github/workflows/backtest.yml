name: Strategy Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Download 2018-2025 historical data
        run: |
          git clone --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data.git

      - name: Download 2026 historical data
        run: |
          git clone --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data_2026.git

      - name: Verify downloaded data
        run: |
          echo "=========================================="
          echo "CURRENT DIRECTORY"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "FILES AND FOLDERS"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "2018-2025 DATA"
          echo "=========================================="

          if [ -d "Nse_Historical_Data" ]; then
            echo "Repository found."

            echo "Parquet files:"
            find Nse_Historical_Data \
              -type f \
              -name "*.parquet" \
              | wc -l
          else
            echo "ERROR: Nse_Historical_Data not found."
          fi

          echo ""
          echo "=========================================="
          echo "2026 DATA"
          echo "=========================================="

          if [ -d "Nse_Historical_Data_2026" ]; then
            echo "Repository found."

            echo "Parquet files:"
            find Nse_Historical_Data_2026 \
              -type f \
              -name "*.parquet" \
              | wc -l
          else
            echo "ERROR: Nse_Historical_Data_2026 not found."
          fi

          echo ""
          echo "=========================================="
          echo "SEARCHING FOR PARQUET FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.parquet" \
            | sed -n '1,30p'

          echo ""
          echo "=========================================="
          echo "TOTAL PARQUET FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.parquet" \
            | wc -l

      - name: Run backtest
        run: |
          python -u backtest.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          if-no-files-found: warn
