```yaml
name: Strategy Backtest

on:
  workflow_dispatch:

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT YOUR STRATEGY REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow


      # ------------------------------------------------------
      # DOWNLOAD 2018-2025 DATA
      # ------------------------------------------------------

      - name: Download 2018-2025 historical data
        run: |
          git clone --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data.git


      # ------------------------------------------------------
      # DOWNLOAD 2026 DATA
      # ------------------------------------------------------

      - name: Download 2026 historical data
        run: |
          git clone --depth 1 \
            https://github.com/ganeshbiyer/Nse_Historical_Data_2026.git


      # ------------------------------------------------------
      # VERIFY DATA
      # ------------------------------------------------------

      - name: Verify downloaded data
        run: |

          echo "=========================================="
          echo "CURRENT DIRECTORY"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "TOP LEVEL FILES / FOLDERS"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "2018-2025 DIRECTORY"
          echo "=========================================="

          if [ -d "Nse_Historical_Data" ]; then
            echo "Nse_Historical_Data exists"

            echo "Parquet files:"
            find Nse_Historical_Data \
              -type f \
              -name "*.parquet" \
              | wc -l
          else
            echo "ERROR: Nse_Historical_Data does not exist"
          fi

          echo ""
          echo "=========================================="
          echo "2026 DIRECTORY"
          echo "=========================================="

          if [ -d "Nse_Historical_Data_2026" ]; then
            echo "Nse_Historical_Data_2026 exists"

            echo "Parquet files:"
            find Nse_Historical_Data_2026 \
              -type f \
              -name "*.parquet" \
              | wc -l
          else
            echo "ERROR: Nse_Historical_Data_2026 does not exist"
          fi

          echo ""
          echo "=========================================="
          echo "SEARCHING ENTIRE WORKSPACE"
          echo "=========================================="

          find . \
            -type f \
            -name "*.parquet" \
            | sed -n '1,30p'

          echo ""
          echo "=========================================="
          echo "TOTAL PARQUET FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.parquet" \
            | wc -l


      # ------------------------------------------------------
      # RUN BACKTEST
      # ------------------------------------------------------

      - name: Run backtest
        run: |
          python -u backtest.py


      # ------------------------------------------------------
      # UPLOAD RESULTS
      # ------------------------------------------------------

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          if-no-files-found: warn
```
