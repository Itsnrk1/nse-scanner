name: Daily NSE Scan

on:
  schedule:
    # 10:30 UTC = 16:00 IST — after the 15:30 IST market close.
    # GitHub Actions cron is UTC-only; Mon-Fri (1-5) only.
    - cron: '30 10 * * 1-5'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance==1.7.0" pandas requests curl_cffi

      - name: Run the scan
        run: python nse_daily_scanner.py

      - name: Commit updated results
        run: |
          git config user.name "nse-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          git diff --quiet --cached || git commit -m "Daily scan results"

          git push
