name: Daily NSE Scan

on:
  schedule:
    # 10:30 UTC = 16:00 IST — after the 15:30 IST market close (the scanner
    # treats today's session as complete from 15:40 IST).
    # GitHub Actions cron is UTC-only; Mon-Fri (1-5) only.
    - cron: '30 10 * * 1-5'

  workflow_dispatch: {}

permissions:
  contents: write

# Never run two scans at once (they would fight over index.html and hit NSE
# twice as hard).
concurrency:
  group: nse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A full ~2,300-stock scan takes a while: every stock is read on the primary
    # source (TradingView by default, a few connections at a time) and every
    # stock that does not pass is then also scanned on Yahoo. This stops a stuck
    # run from hanging.
    timeout-minutes: 180

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance==1.7.0" pandas requests curl_cffi websocket-client

      # Only used when DATA_SOURCE is "NSE": the scanner saves each stock's NSE
      # chart token in nse_token_cache.json so every symbol is looked up once.
      # (With TradingView, the default, the file does not exist and this is a no-op.)
      - name: Restore NSE token cache
        uses: actions/cache/restore@v4
        with:
          path: nse_token_cache.json
          key: nse-token-cache-${{ github.run_id }}
          restore-keys: |
            nse-token-cache-

      - name: Run the scan
        run: python nse_daily_scanner.py

      # Runs even if the scan or a later step fails, so the lookups done so far
      # are not lost. (The cache file is not committed to the repository.)
      - name: Save NSE token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nse_token_cache.json
          key: nse-token-cache-${{ github.run_id }}

      - name: Commit updated results
        run: |
          git config user.name "nse-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          git diff --quiet --cached || git commit -m "Daily scan results"

          git pull --rebase
          git push
